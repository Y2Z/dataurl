# Fuzz targets for dataurl, run with cargo-fuzz (needs a nightly toolchain):
#   cargo install cargo-fuzz
#   cargo +nightly fuzz run parse
#   cargo +nightly fuzz run serialize
# They use the same checks as tests/roundtrip.rs (in tests/common/roundtrip.rs).

[package]
name = "dataurl-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
dataurl = { path = "..", default-features = false }
libfuzzer-sys = "0.4"

# Keeps this crate out of any workspace the parent directory might be in
[workspace]
members = ["."]

[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "serialize"
path = "fuzz_targets/serialize.rs"
test = false
doc = false
bench = false
