# CD GitHub Actions workflow for dataurl

name: CD

on:
  release:
    types:
    - created

jobs:

  windows:
    runs-on: windows-2022
    steps:
    - run: git config --global core.autocrlf false
    - name: Checkout the repository
      uses: actions/checkout@v4
    - name: Build the executable
      run: cargo build --release --locked
    - name: Attach artifact to the release
      uses: Shopify/upload-to-release@v2.0.0
      with:
        name: dataurl.exe
        path: target\release\dataurl.exe
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  gnu_linux_armhf:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
    - name: Prepare cross-platform environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-arm-linux-gnueabihf
        rustup target add arm-unknown-linux-gnueabihf
        echo "CARGO_TARGET_ARM_UNKNOWN_LINUX_GNUEABIHF_LINKER=arm-linux-gnueabihf-gcc" >> $GITHUB_ENV
    - name: Build the executable
      run: cargo build --release --locked --target=arm-unknown-linux-gnueabihf
    - name: Attach artifact to the release
      uses: Shopify/upload-to-release@v2.0.0
      with:
        name: dataurl-gnu-linux-armhf
        path: target/arm-unknown-linux-gnueabihf/release/dataurl
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  gnu_linux_aarch64:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
    - name: Prepare cross-platform environment
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu
        rustup target add aarch64-unknown-linux-gnu
        echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV
    - name: Build the executable
      run: cargo build --release --locked --target=aarch64-unknown-linux-gnu
    - name: Attach artifact to the release
      uses: Shopify/upload-to-release@v2.0.0
      with:
        name: dataurl-gnu-linux-aarch64
        path: target/aarch64-unknown-linux-gnu/release/dataurl
        repo-token: ${{ secrets.GITHUB_TOKEN }}

  gnu_linux_x86_64:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout the repository
      uses: actions/checkout@v4
    - name: Build the executable
      run: cargo build --release --locked
    - name: Attach artifact to the release
      uses: Shopify/upload-to-release@v2.0.0
      with:
        name: dataurl-gnu-linux-x86_64
        path: target/release/dataurl
        repo-token: ${{ secrets.GITHUB_TOKEN }}
