[package]
name = "dataurl"
version = "0.3.0"
authors = [
    "Sunshine <snshn@tutanota.com>",
]
edition = "2021"
rust-version = "1.74"
description = "CLI tool and Rust crate for parsing and generating data URLs"
homepage = "https://github.com/Y2Z/dataurl"
repository = "https://github.com/Y2Z/dataurl"
documentation = "https://docs.rs/dataurl"
readme = "README.md"
keywords = ["data-url", "base64", "mime", "uri", "command-line"]
categories = ["command-line-utilities", "encoding", "parsing", "web-programming"]
include = [
    "src/**/*.rs",
    "tests/**/*",
    "Cargo.toml",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
]
license = "CC0-1.0"

[dependencies]
encoding_rs = "0.8.35" # Used for charsets (label validation, decoding and encoding text)
infer = { version = "0.22.0", default-features = false } # Used for detecting media types by file signature
serde = { version = "1.0", default-features = false, optional = true } # Used for the optional serde support

[dev-dependencies]
serde_test = "1.0.177" # Used for testing the serde support

[features]
default = ["cli"]
cli = [] # Build the dataurl executable (no extra dependencies, kept for compatibility)
serde = ["dep:serde"] # Implement Serialize and Deserialize for DataUrl and MimeType

[package.metadata.docs.rs]
all-features = true

[[bin]]
name = "dataurl"
path = "src/main.rs"
required-features = ["cli"]
